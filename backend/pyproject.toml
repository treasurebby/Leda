[project]
name = "leda-backend"
version = "0.1.0"
description = "Leda API: WhatsApp orders, verification queue, payments and ledger for Nigerian wholesale distributors."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "boto3>=1.35",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: hits real third-party APIs; needs keys"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
